name: Build Membrane OS Captain ISO

on:
  workflow_dispatch:
  push:
    branches: [main, fix-visible-recovery]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Check available disk space
        run: df -h

      - name: Build ISO with ArchISO
        run: |
          install -Dm644 /dev/null airootfs/etc/membrane-os/revision
          printf '%s\n' "$GITHUB_SHA" > airootfs/etc/membrane-os/revision
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            archlinux:latest \
            bash -euc '
              pacman -Syu --noconfirm --needed archiso
              ./build.sh
              cd out
              sha256sum *.iso > SHA256SUMS
            '

      - name: Upload complete ISO
        uses: actions/upload-artifact@v4
        with:
          name: Membrane-OS-Captain-${{ github.run_number }}
          path: |
            out/*.iso
            out/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
